[package]
name = "nakode"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A provider-neutral agent server with generated SDKs and thin clients"

[workspace]
members = [
  "crates/nakode-protocol",
  "crates/nakode-sdk",
  "crates/nakode-server",
]
exclude = ["crates/nakode-api"]
resolver = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Keep development builds quick without removing useful line information from
# backtraces. Release builds are unaffected.
[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true

[features]
default = []
codex-process-adapter = []
# Compiles a deterministic Codex process override exclusively for cross-repository E2E tests.
# Production builds do not include or recognize the fixture-provider environment variable.
e2e-fixture-provider = ["codex-process-adapter"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clipboard-rs = "0.3.5"
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-util = "0.3"
fs2 = "0.4"
flate2 = "1"
globset = "0.4"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
nakode-protocol = { path = "crates/nakode-protocol" }
nakode-server = { path = "crates/nakode-server" }
nakode-sdk = { path = "crates/nakode-sdk" }
open = "5"
portable-pty = "0.9"
prost = "0.14"
pulldown-cmark = "0.13"
rand = "0.9"
ratatui = "0.30"
rcgen = "0.14"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
regex = "1"
rpassword = "7"
rquickjs = "0.12.2"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shell-words = "1"
similar = "3.2.0"
syntect = { version = "5", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
thiserror = "2"
tokio = { version = "1.52", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tempfile = "3"
toml = "0.9"
tonic = { version = "0.14.6", features = ["tls-ring"] }
unicode-width = "0.2"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
uuid = { version = "1", features = ["v5", "v7"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[dev-dependencies]
libc = "0.2"
