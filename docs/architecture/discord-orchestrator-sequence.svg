<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" aria-label="Discord orchestrator sequence" role="img" viewBox="0 0 1800 1150"><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="context-stroke" d="M0,0 L0,6 L9,3 z"/></marker><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="2" flood-opacity=".1" stdDeviation="3"/></filter></defs><rect width="100%" height="100%" fill="#fff"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M150 200 L150 1130" opacity=".7"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M410 200 L410 1130" opacity=".7"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M705 200 L705 1130" opacity=".7"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M1030 200 L1030 1130" opacity=".7"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M1350 200 L1350 1130" opacity=".7"/><path fill="none" stroke="#cbd5e1" stroke-dasharray="7 6" stroke-width="1" d="M1640 200 L1640 1130" opacity=".7"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" d="M1640 220 L1030 255"/><rect width="127" height="40" x="1271.5" y="217.5" fill="#fff" rx="4"/><text fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1335" y="228.8">typed</tspan><tspan x="1335" y="246.2">create/open</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" d="M1030 370 L705 370"/><rect width="169" height="40" x="783" y="350" fill="#fff" rx="4"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="867.5" y="361.2">replacement bridge</tspan><tspan x="867.5" y="378.8">view</tspan></text><path fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" d="M705 370 L410 370"/><rect width="190" height="40" x="462.5" y="350" fill="#fff" rx="4"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="557.5" y="361.2">create/bind correct</tspan><tspan x="557.5" y="378.8">parent</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M1350 370 L1030 390"/><rect width="120" height="40" x="1130" y="360" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1190" y="371.2">live/final</tspan><tspan x="1190" y="388.8">event</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M1030 535 L705 535"/><rect width="148" height="40" x="793.5" y="515" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="867.5" y="526.2">checkpoint</tspan><tspan x="867.5" y="543.8">committed</tspan></text><path fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" d="M705 535 L410 535"/><rect width="148" height="40" x="483.5" y="515" fill="#fff" rx="4"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="557.5" y="526.2">ordered 🟡 / ✅</tspan><tspan x="557.5" y="543.8">output</tspan></text><path fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)" d="M150 545 L410 545"/><rect width="118" height="40" x="221" y="523" fill="#fff" rx="4"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="280" y="545">message</tspan></text><path fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)" d="M410 720 L705 720"/><rect width="120" height="40" x="497.5" y="700" fill="#fff" rx="4"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="557.5" y="711.2">authorized</tspan><tspan x="557.5" y="728.8">event</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" d="M705 720 L1030 720"/><rect width="134" height="40" x="800.5" y="700" fill="#fff" rx="4"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="867.5" y="711.2">typed</tspan><tspan x="867.5" y="728.8">continuation</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M1030 720 L1350 720"/><rect width="134" height="40" x="1123" y="700" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1190" y="711.2">stable client</tspan><tspan x="1190" y="728.8">turn</tspan></text><path fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)" d="M150 720 L410 740"/><rect width="190" height="40" x="185" y="710" fill="#fff" rx="4"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="280" y="721.2">message during active</tspan><tspan x="280" y="738.8">turn</tspan></text><path fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" d="M1030 910 L410 910"/><rect width="268" height="24" x="586" y="890" fill="#fff" rx="4"/><text fill="#dc2626" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="720" y="910">Busy / duplicate → ❌</tspan></text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" d="M1640 885 L1030 885"/><rect width="178" height="24" x="1246" y="865" fill="#fff" rx="4"/><text fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1335" y="885">archive / open intent</tspan></text><path fill="none" stroke="#475569" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M1030 1070 L705 1070"/><rect width="152" height="36" x="791.5" y="1052" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="867.5" y="1074">restored mapping</tspan></text><path fill="none" stroke="#475569" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M705 1110 L410 1110"/><rect width="224" height="40" x="445.5" y="1090" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="557.5" y="1110">archive/unarchive / clear 404</tspan></text><path fill="none" stroke="#475569" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M1350 1090 L1030 1090"/><rect width="148" height="40" x="1116" y="1070" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1190" y="1090">deferred retry</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="45" y="48">Discord orchestrator thread lifecycle and delivery sequence</tspan></text><text fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start"><tspan x="45" y="90">Chat and Agent share semantics; their parent channels and logical kinds remain distinct</tspan></text><rect width="190" height="65" x="55" y="135" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="69" y="160">Primary user</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="69" y="175.8">Configured snowflake</tspan><tspan x="69" y="193.2">only</tspan></text><rect width="220" height="65" x="300" y="135" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="314" y="160">Discord thread</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="314" y="184.5">Exact paired thread</tspan></text><rect width="245" height="65" x="585" y="135" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="599" y="160">Discord adapter</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="599" y="184.5">Gateway + REST</tspan></text><rect width="260" height="65" x="900" y="135" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="914" y="160">Nakode API + SQLite</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="914" y="184.5">Typed authority/checkpoints</tspan></text><rect width="235" height="65" x="1235" y="135" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1249" y="160">Session runtime</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="1249" y="184.5">Readiness + provider</tspan></text><rect width="220" height="65" x="1530" y="135" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1544" y="160">FStack dashboard</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start"><tspan x="1544" y="184.5">Chat / Agent lifecycle</tspan></text><rect width="1650" height="95" x="75" y="255" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="89" y="280">1 · Create / reopen</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="89" y="310.8">FStack sends Chat or Agent bridge intent → Nakode persists stable logical mapping (thread may be absent) → adapter lazily creates under the correct parent and atomically binds the thread snowflake. Restart</tspan><tspan x="89" y="328.2">restores this row; titles are never identity.</tspan></text><rect width="1650" height="125" x="75" y="390" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="89" y="415">2 · Outbound live and final</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="89" y="460.8">Runtime publishes user-visible live text → adapter edits/recreates one 🟡 message. Completion: sanitize/hash/count → PREPARE → deterministic nonce parts in order →</tspan><tspan x="89" y="478.2">advance monotonic progress + latest message ID → completion reaction → FINALIZE cursor. Retry recovers nonces; old cursors page to a private spool.</tspan></text><rect width="1650" height="145" x="75" y="555" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="89" y="580">3A · Inbound while READY</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="89" y="609.5">Primary user in exact thread → user/echo/route check → durable ingress checkpoint before feedback/RPC.</tspan><tspan x="89" y="627">Explicit multipart only: bounded ordered assembly, 30-minute expiry + tombstone cleanup; ordinary messages never join.</tspan><tspan x="89" y="644.5">Images: approved Discord CDN/type/size → download into pending inbox; failure is durably consumed + ⚠️.</tspan><tspan x="89" y="662">Nakode atomically validates READY, claims ledger + stable client turn → 🔄 → continue same session; provider acknowledgement clears inbox.</tspan></text><rect width="1650" height="125" x="75" y="740" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#dc2626" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="89" y="765">3B · Inbound while BUSY / saturated</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="89" y="810.8">Same authorization + ingress checkpoint → overlap/saturation is durably forced-busy and gets immediate ❌ → replay claims Nakode ledger with `consume_as_busy` → terminal tombstone/removal. A normal readiness race</tspan><tspan x="89" y="828.2">also returns BUSY. No queue/steer/later prompt; duplicate gateway events are local tombstones or Nakode DUPLICATE no-ops.</tspan></text><rect width="1000" height="115" x="75" y="925" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="89" y="950">4A · Close + restart</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="89" y="974.5">Dashboard close → archive; reopen → unarchive/no-op.</tspan><tspan x="89" y="992">Fresh start archives before IPC; shutdown archive barrier precedes teardown under a hard deadline.</tspan><tspan x="89" y="1009.5">Restart restores the durable mapping.</tspan><tspan x="89" y="1027">404 clears binding; later reconciliation recreates only while lifecycle is open.</tspan></text><rect width="630" height="115" x="1095" y="925" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1109" y="950">4B · Failure + retry</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1109" y="974.5">429/network/permission failures defer safely; metadata is sanitized.</tspan><tspan x="1109" y="992">Nonce + durable checkpoints make retries idempotent.</tspan><tspan x="1109" y="1009.5">Reconnect replays ingress and resumes cursors.</tspan><tspan x="1109" y="1027">Corrupt rows quarantine fail-closed; cancellation cleans workers/listeners.</tspan></text></svg>