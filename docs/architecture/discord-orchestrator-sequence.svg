<path d="M1350 1090 L1030 1090" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="1116" y="1070" width="148" height="40" rx="4" fill="#ffffff"/>
<text text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#475569"><tspan x="1190" y="1090">deferred retry</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" fill="#1f2937"><tspan x="45" y="48.0">Discord orchestrator thread lifecycle and delivery sequence</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#64748b"><tspan x="45" y="90.0">Chat and Agent share semantics; their parent channels and logical kinds remain distinct</tspan></text>
<rect x="55" y="135" width="190" height="65" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0891b2"><tspan x="69" y="160.0">Primary user</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="69" y="175.8">Configured snowflake</tspan><tspan x="69" y="193.2">only</tspan></text>
<rect x="300" y="135" width="220" height="65" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#d97706"><tspan x="314" y="160.0">Discord thread</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="314" y="184.5">Exact paired thread</tspan></text>
<rect x="585" y="135" width="245" height="65" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#d97706"><tspan x="599" y="160.0">Discord adapter</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="599" y="184.5">Gateway + REST</tspan></text>
<rect x="900" y="135" width="260" height="65" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#16a34a"><tspan x="914" y="160.0">Nakode API + SQLite</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="914" y="184.5">Typed authority/checkpoints</tspan></text>
<rect x="1235" y="135" width="235" height="65" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#16a34a"><tspan x="1249" y="160.0">Session runtime</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="1249" y="184.5">Readiness + provider</tspan></text>
<rect x="1530" y="135" width="220" height="65" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#2563eb"><tspan x="1544" y="160.0">FStack dashboard</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1f2937"><tspan x="1544" y="184.5">Chat / Agent lifecycle</tspan></text>
<rect x="75" y="255" width="1650" height="95" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#7c3aed"><tspan x="89" y="280.0">1 · Create / reopen</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="89" y="310.8">FStack sends Chat or Agent bridge intent → Nakode persists stable logical mapping (thread may be absent) → adapter lazily creates under the correct parent and atomically binds the thread snowflake. Restart</tspan><tspan x="89" y="328.2">restores this row; titles are never identity.</tspan></text>
<rect x="75" y="390" width="1650" height="125" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#16a34a"><tspan x="89" y="415.0">2 · Outbound user, live, and final</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="89" y="460.8">Dashboard User → typed PREPARE → destination nonce parts + 🔄 → FINALIZE User cursor before assistant; trusted Discord-source User → zero-part cursor, never echo.</tspan><tspan x="89" y="478.2">Assistant live → one editable 🟡 message. Assistant completion → typed PREPARE → ordered nonce parts + ✅ → monotonic progress → FINALIZE; retries recover nonces/spool.</tspan></text>
<rect x="75" y="555" width="1650" height="145" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#0891b2"><tspan x="89" y="580.0">3A · Inbound while READY</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="89" y="609.5">Primary user in exact thread → user/echo/route check → durable ingress checkpoint before feedback/RPC.</tspan><tspan x="89" y="627.0">Explicit multipart only: bounded ordered assembly, 30-minute expiry + tombstone cleanup; ordinary messages never join.</tspan><tspan x="89" y="644.5">Images: approved Discord CDN/type/size → download into pending inbox; failure is durably consumed + ⚠️.</tspan><tspan x="89" y="662.0">Nakode atomically validates READY, claims ledger + stable client turn → 🔄 → continue same session; provider acknowledgement clears inbox.</tspan></text>
<rect x="75" y="740" width="1650" height="125" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#dc2626"><tspan x="89" y="765.0">3B · Inbound while BUSY / saturated</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="89" y="810.8">Same authorization + ingress checkpoint → overlap/saturation is durably forced-busy and gets immediate ❌ → replay claims Nakode ledger with `consume_as_busy` → terminal tombstone/removal. A normal readiness race</tspan><tspan x="89" y="828.2">also returns BUSY. No queue/steer/later prompt; duplicate gateway events are local tombstones or Nakode DUPLICATE no-ops.</tspan></text>
<rect x="75" y="925" width="1000" height="115" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#475569"><tspan x="89" y="950.0">4A · Close + restart</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="89" y="974.5">Dashboard close → archive; reopen → unarchive/no-op.</tspan><tspan x="89" y="992.0">Fresh start archives before IPC; shutdown archive barrier precedes teardown under a hard deadline.</tspan><tspan x="89" y="1009.5">Restart restores the durable mapping.</tspan><tspan x="89" y="1027.0">404 clears binding; later reconciliation recreates only while lifecycle is open.</tspan></text>
<rect x="1095" y="925" width="630" height="115" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#475569"><tspan x="1109" y="950.0">4B · Failure + retry</tspan></text>
<text text-anchor="start" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" fill="#1f2937"><tspan x="1109" y="974.5">429/network/permission failures defer safely; metadata is sanitized.</tspan><tspan x="1109" y="992.0">3s point-RPC / 30s REST deadlines bound retries.</tspan><tspan x="1109" y="1009.5">Nonce + durable checkpoints resume ingress/cursors.</tspan><tspan x="1109" y="1027.0">Per-workspace gateways share Identify only; overlap remains NO-GO.</tspan></text>
</svg>
