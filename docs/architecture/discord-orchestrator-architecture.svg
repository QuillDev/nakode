 font-weight="600" text-anchor="middle"><tspan x="342.5" y="388.8">typed</tspan><tspan x="342.5" y="406.2">lifecycle</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" d="M630 290 L650 290 L650 220 L705 220"/><rect width="80" height="40" x="628" y="200" fill="#fff" rx="4"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="668" y="220">commands</tspan></text><path fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)" d="M705 300 L680 300 L680 380 L630 380"/><rect width="118" height="40" x="608.5" y="350" fill="#fff" rx="4"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="667.5" y="370">snapshots</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M855 310 L855 350"/><rect width="118" height="40" x="796" y="310" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="855" y="330">turn events</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M950 350 L950 330 L1080 330"/><rect width="118" height="40" x="941" y="310" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1000" y="330">bridge views</tspan></text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)" d="M1080 470 L1005 500"/><rect width="73" height="40" x="1006" y="465" fill="#fff" rx="4"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1042.5" y="476.2">durable</tspan><tspan x="1042.5" y="493.8">commit</tspan></text><path fill="none" stroke="#dc2626" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M1230 405 L1230 365"/><rect width="118" 