end="url(#arrow)" d="M1005 545 L1075 620 L1075 690"/><rect width="118" height="40" x="1084" y="604" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1143" y="624">ready/busy</tspan></text><path fill="none" stroke="#475569" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M1380 570 L1450 625 L1595 690"/><rect width="158" height="40" x="1421" y="570" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="1500" y="581.2">Discord/API</tspan><tspan x="1500" y="598.8">failures</tspan></text><path fill="none" stroke="#475569" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)" d="M705 520 L455 520 L245 690"/><rect width="118" height="40" x="481" y="533" fill="#fff" rx="4"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle"><tspan x="540" y="553">archive/restart</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start"><tspan x="45" y="48">FStack ↔ Nakode ↔ Discord orchestrator threads</tspan></text><text fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start"><tspan x="45" y="90">Authority, configuration, durable mapping, event flow, lifecycle, and failure isolation</tspan></text><rect width="250" height="145" x="55" y="170" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="69" y="195">FStack Chat</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="69" y="242">Create: kind=CHAT + open</tspan><tspan x="69" y="259.5">Close/app lifecycle: archive</tspan><tspan x="69" y="277">No Discord token or network</tspan></text><rect width="250" height="145" x="55" y="350" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="69" y="375">FStack Ticket Agent</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="69" y="404.5">Create/resume: kind=AGENT</tspan><tspan x="69" y="422">Close/open:</tspan><tspan x="69" y="439.5">archive/unarchive</tspan><tspan x="69" y="457">Typed capability-gated RPCs</tspan><tspan x="69" y="474.5">only</tspan></text><rect width="250" height="210" x="380" y="225" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#7c3aed" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="394" y="250">nakode.v1 + SDK</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="394" y="294.5">Versioned typed commands</tspan><tspan x="394" y="312">Replacement</tspan><tspan x="394" y="329.5">workspace/session views</tspan><tspan x="394" y="347">Bounded retries +</tspan><tspan x="394" y="364.5">idempotency keys</tspan><tspan x="394" y="382">OrchestratorThreadBridge</tspan><tspan x="394" y="399.5">capability</tspan></text><rect width="300" height="165" x="705" y="145" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="719" y="170">Nakode session authority</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="719" y="218.2">Logical Chat + Agent sessions</tspan><tspan x="719" y="235.8">Readiness, turns, transcripts</tspan><tspan x="719" y="253.2">Provider lifecycle + resumability</tspan><tspan x="719" y="270.8">User-visible content boundary</tspan></text><rect width="300" height="230" x="705" y="350" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#16a34a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="719" y="375">Bridge state · SQLite</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="719" y="420.8">Identity: session kind + lifecycle</tspan><tspan x="719" y="438.2">Unique thread snowflake binding</tspan><tspan x="719" y="455.8">Inbound: replay ledger + pending prompt</tspan><tspan x="719" y="473.2">Stable client + source message IDs</tspan><tspan x="719" y="490.8">Delivery: hash/count + progress</tspan><tspan x="719" y="508.2">Latest/live external message IDs</tspan><tspan x="719" y="525.8">Commit before external side effects</tspan></text><rect width="300" height="205" x="1080" y="160" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#d97706" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1094" y="185">Native Discord adapter</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1094" y="227">Gateway + REST client</tspan><tspan x="1094" y="244.5">Private durable ingress spool</tspan><tspan x="1094" y="262">16 active slots + forced-busy</tspan><tspan x="1094" y="279.5">nonce/rate-limit recovery</tspan><tspan x="1094" y="297">UTF-16 fenced chunk iterator</tspan><tspan x="1094" y="314.5">mentions disabled + errors</tspan><tspan x="1094" y="332">sanitized</tspan></text><rect width="300" height="165" x="1080" y="405" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#dc2626" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1094" y="430">System configuration</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1094" y="452">system discord.toml: enabled + 3</tspan><tspan x="1094" y="469.5">snowflakes</tspan><tspan x="1094" y="487">private system discord.token (0600)</tspan><tspan x="1094" y="504.5">Chat parent • Agent parent •</tspan><tspan x="1094" y="522">primary user</tspan><tspan x="1094" y="539.5">Invalid/absent ⇒ integration</tspan><tspan x="1094" y="557">disabled safely</tspan></text><rect width="225" height="150" x="1570" y="145" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1584" y="170">Chat parent channel</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1584" y="210.8">One thread per active</tspan><tspan x="1584" y="228.2">Chat conversation</tspan><tspan x="1584" y="245.8">Readable title;</tspan><tspan x="1584" y="263.2">snowflake identity</tspan></text><rect width="225" height="150" x="1570" y="365" fill="#cffafe" stroke="#0891b2" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#0891b2" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1584" y="390">Agent parent channel</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1584" y="430.8">One thread per active</tspan><tspan x="1584" y="448.2">Agent session</tspan><tspan x="1584" y="465.8">Readable title;</tspan><tspan x="1584" y="483.2">snowflake identity</tspan></text><rect width="310" height="150" x="90" y="690" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="104" y="715">Lifecycle + restart</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="104" y="738.2">Close ⇒ archive mapped thread</tspan><tspan x="104" y="755.8">Reopen ⇒ unarchive/no-op if open</tspan><tspan x="104" y="773.2">Fresh start archives before IPC</tspan><tspan x="104" y="790.8">Shutdown archive barrier precedes</tspan><tspan x="104" y="808.2">teardown; hard process deadline</tspan><tspan x="104" y="825.8">Existing mapping reused after restart</tspan></text><rect width="330" height="150" x="490" y="690" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="504" y="715">Outbound transcript</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="504" y="743.8">🟡 live: one editable message</tspan><tspan x="504" y="761.2">✅ final: hash/count → nonce parts</tspan><tspan x="504" y="778.8">monotonic progress + latest ID</tspan><tspan x="504" y="796.2">completion reaction → final cursor</tspan></text><rect width="330" height="150" x="910" y="690" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="924" y="715">Inbound continuation</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="924" y="738.2">Exact user + paired open thread</tspan><tspan x="924" y="755.8">Ingress checkpoint before feedback/RPC</tspan><tspan x="924" y="773.2">Explicit multipart: bounded + 30m expiry</tspan><tspan x="924" y="790.8">Image CDN/type/size; failure → ⚠️</tspan><tspan x="924" y="808.2">Ready → 🔄; busy/overload → ❌</tspan><tspan x="924" y="825.8">Terminal IDs tombstoned/ledgered</tspan></text><rect width="370" height="150" x="1410" y="690" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#shadow)" rx="14"/><text fill="#475569" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="1424" y="715">Failure boundaries</tspan></text><text fill="#1f2937" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="1424" y="738.2">404 clears binding; recreate only if open</tspan><tspan x="1424" y="755.8">429/network/permissions defer safely</tspan><tspan x="1424" y="773.2">Corrupt ingress quarantined fail-closed</tspan><tspan x="1424" y="790.8">Nonce/checkpoints prevent duplicates</tspan><tspan x="1424" y="808.2">Sanitized failures preserve authority</tspan></text><text fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start"><tspan x="45" y="875">Connector legend — solid: typed/data flow · dashed: lifecycle, status, recovery, or failure · color: initiating boundary</tspan></text></svg>