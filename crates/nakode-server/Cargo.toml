[package]
name = "nakode-server"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Persistent frontend-neutral transport and subscription broker for Nakode"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
nakode-protocol = { path = "../nakode-protocol" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["io-util", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
nakode-client = { path = "../nakode-client" }
tokio = { version = "1.52", features = ["io-util", "macros", "rt", "sync"] }
