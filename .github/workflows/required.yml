name: Required

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit should replace older work for the same PR, while main and other
# PRs retain independent groups.
concurrency:
  group: required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxcb1-dev libx11-dev libxfixes-dev
      - name: Restore Rust cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node 24
        with:
          shared-key: required-lint
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Record cache diagnostics
        if: always()
        run: |
          echo "rust-cache hit: ${{ steps.cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null || true

  test:
    name: Test (all targets + features)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.0"
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libxcb1-dev libx11-dev libxfixes-dev
      - name: Restore Rust cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node 24
        with:
          shared-key: required-test
      - name: Run tests
        run: cargo test --locked --all-targets --all-features
      - name: Record cache diagnostics
        if: always()
        run: |
          echo "rust-cache hit: ${{ steps.cache.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
          du -sh target 2>/dev/null || true

  embedded:
    name: Headless runtime crate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, Node 24
        with:
          shared-key: embedded
      - run: cargo clippy --locked -p nakode-runtime -- -D warnings
      - name: Verify headless dependency boundary
        run: |
          cargo tree --locked -p nakode-runtime -e normal > /tmp/runtime-dependencies
          if grep -E '(clipboard-rs|ratatui|crossterm)' /tmp/runtime-dependencies; then
            echo 'The runtime must not depend on terminal UI or desktop clipboard crates' >&2
            exit 1
          fi
  publish-runtime:
    name: Publish immutable runtime source
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: [lint, test, embedded]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Publish tested crate workspace and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="runtime-$GITHUB_SHA"
          git archive --format=tar.gz --prefix=nakode-runtime/ HEAD > nakode-runtime-source.tar.gz
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, tomllib
          source = pathlib.Path("nakode-runtime-source.tar.gz")
          manifest = tomllib.loads(pathlib.Path("crates/nakode-runtime/Cargo.toml").read_text())
          pathlib.Path("runtime.json").write_text(json.dumps({
              "schemaVersion": 1, "crate": "nakode-runtime",
              "version": manifest["package"]["version"],
              "revision": os.environ["GITHUB_SHA"],
              "sourceSha256": hashlib.sha256(source.read_bytes()).hexdigest()
          }) + "\n")
          PYTHON
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Immutable runtime release already exists: $tag"
          else
            gh release create "$tag" nakode-runtime-source.tar.gz runtime.json --target "$GITHUB_SHA" --title "Runtime $GITHUB_SHA" --notes "Tested embeddable Nakode runtime. Cargo consumers pin this exact source revision; FStack ships the engine in its own executable." --latest
          fi
