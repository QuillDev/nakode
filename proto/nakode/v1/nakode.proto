syntax = "proto3";

package nakode.v1;

option go_package = "github.com/QuillDev/nakode/gen/go/nakode/v1;nakodev1";

import "google/protobuf/empty.proto";

// NakodeService is the complete product boundary used by every frontend.
// Watch methods emit authoritative replacement snapshots, not reducer events.
service NakodeService {
  rpc GetWorkspace(GetWorkspaceRequest) returns (WorkspaceSnapshot);
  rpc WatchWorkspace(WatchWorkspaceRequest) returns (stream WorkspaceSnapshot);
  rpc ReloadWorkspace(ReloadWorkspaceRequest) returns (MutationResult);
  // Reads and atomically persists Nakode's single configured SOUL.md. Existing provider sessions
  // retain the instructions they started with; fresh sessions observe a successful save.
  rpc GetSoul(GetSoulRequest) returns (SoulDocument);
  rpc SaveSoul(SaveSoulRequest) returns (MutationResult);

  // Nakode-owned, workspace-scoped MCP authority. Returned records are always redacted.
  rpc GetMcpManagement(GetMcpManagementRequest) returns (McpManagement);
  rpc SaveMcpServer(SaveMcpServerRequest) returns (MutationResult);
  rpc DeleteMcpServer(DeleteMcpServerRequest) returns (MutationResult);
  rpc SetMcpServerEnabled(SetMcpServerEnabledRequest) returns (MutationResult);
  rpc RefreshMcpServer(RefreshMcpServerRequest) returns (MutationResult);
  rpc SetMcpServerCredential(SetMcpServerCredentialRequest) returns (MutationResult);
  rpc ClearMcpServerCredential(ClearMcpServerCredentialRequest) returns (MutationResult);
  rpc SetMcpServerGrants(SetMcpServerGrantsRequest) returns (MutationResult);

  // Installation-level Discord configuration and the transport state of this workspace service.
  // The bot token is write-only and is never projected by a response.
  rpc GetDiscordIntegration(GetDiscordIntegrationRequest) returns (DiscordIntegration);
  rpc SaveDiscordIntegration(SaveDiscordIntegrationRequest) returns (DiscordIntegration);
  rpc SetDiscordIntegrationEnabled(SetDiscordIntegrationEnabledRequest) returns (DiscordIntegration);
  rpc RestartDiscordIntegration(RestartDiscordIntegrationRequest) returns (DiscordIntegration);

  rpc CreateSession(CreateSessionRequest) returns (MutationResult);
  rpc OpenSession(OpenSessionRequest) returns (MutationResult);
  rpc SetSessionBridgeLifecycle(SetSessionBridgeLifecycleRequest) returns (MutationResult);
  rpc SetWorkspaceBridgeLifecycle(SetWorkspaceBridgeLifecycleRequest) returns (MutationResult);
  rpc BindSessionBridgeThread(BindSessionBridgeThreadRequest) returns (MutationResult);
  rpc ClearSessionBridgeThread(ClearSessionBridgeThreadRequest) returns (MutationResult);
  rpc PrepareBridgeDelivery(PrepareBridgeDeliveryRequest) returns (MutationResult);
  rpc CompleteBridgeDeliveryPart(CompleteBridgeDeliveryPartRequest) returns (MutationResult);
  rpc FinalizeBridgeDelivery(FinalizeBridgeDeliveryRequest) returns (MutationResult);
  rpc SetBridgeLiveMessage(SetBridgeLiveMessageRequest) returns (MutationResult);
  rpc ContinueSessionFromBridge(ContinueSessionFromBridgeRequest) returns (ContinueSessionFromBridgeResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (MutationResult);
  rpc GetSession(GetSessionRequest) returns (SessionSnapshot);
  rpc WatchSession(WatchSessionRequest) returns (stream SessionSnapshot);
  // Appends one owner prompt and evaluates start-versus-queue against authoritative state when the
  // command executes. expected_revision does not fence this operation; idempotency_key distinguishes
  // deliberate repeated sends from a retry of one logical send.
  rpc SendPrompt(SendPromptRequest) returns (MutationResult);
  rpc EnqueuePrompt(EnqueuePromptRequest) returns (MutationResult);
  rpc RemoveQueuedPrompt(RemoveQueuedPromptRequest) returns (MutationResult);
  // Atomically redirects active work to one queued prompt. Providers steer the current turn when
  // supported; interruption-only providers stop it and start the selected prompt next.
  // Requires the `QueuedPromptSteering` service capability and provider steering or interruption.
  rpc SteerQueuedPrompt(SteerQueuedPromptRequest) returns (MutationResult);
  rpc SteerTurn(SteerTurnRequest) returns (MutationResult);
  rpc CancelTurn(CancelTurnRequest) returns (MutationResult);
  rpc CancelSessionWork(CancelSessionWorkRequest) returns (MutationResult);
  rpc CompactContext(CompactContextRequest) returns (MutationResult);
  rpc ResolveInteraction(ResolveInteractionRequest) returns (MutationResult);
  rpc ConfigureSessionTools(ConfigureSessionToolsRequest) returns (MutationResult);
  rpc SubmitExternalToolResult(SubmitExternalToolResultRequest) returns (MutationResult);
  rpc RunShell(RunShellRequest) returns (MutationResult);

  rpc SelectModel(SelectModelRequest) returns (MutationResult);
  rpc SetProviderEnabled(SetProviderEnabledRequest) returns (MutationResult);
  rpc SetProviderModelFilter(SetProviderModelFilterRequest) returns (MutationResult);
  rpc BeginProviderAuthentication(BeginProviderAuthenticationRequest) returns (MutationResult);
  rpc SetProviderCredential(SetProviderCredentialRequest) returns (MutationResult);
  rpc ClearProviderCredential(ClearProviderCredentialRequest) returns (MutationResult);
  rpc ReloadProvider(ReloadProviderRequest) returns (MutationResult);
  rpc SaveAgent(SaveAgentRequest) returns (MutationResult);
  rpc DeleteAgent(DeleteAgentRequest) returns (MutationResult);
  rpc UpdateSettings(UpdateSettingsRequest) returns (MutationResult);
  rpc CheckAgentBrowser(CheckAgentBrowserRequest) returns (MutationResult);

  rpc Delegate(DelegateRequest) returns (MutationResult);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (RunSnapshot);
  rpc WatchRun(WatchRunRequest) returns (stream RunSnapshot);
  rpc CancelRun(CancelRunRequest) returns (MutationResult);

  rpc GetTranscriptPage(GetTranscriptPageRequest) returns (TranscriptPage);
  rpc GetTranscriptBodyWindow(GetTranscriptBodyWindowRequest) returns (TranscriptBodyWindow);
  rpc GetRunTextWindow(GetRunTextWindowRequest) returns (RunTextWindow);
  rpc GetArtifact(GetArtifactRequest) returns (Artifact);
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (DiagnosticsReport);
  // Local-only owner-opted capability invocation usage. Summary joins current catalogue entries;
  // timeline is server-bucketed and bounded, never an unbounded raw event stream.
  rpc GetInvocationSummary(GetInvocationSummaryRequest) returns (InvocationSummary);
  rpc GetInvocationTimeline(GetInvocationTimelineRequest) returns (InvocationTimeline);
  rpc GetServerInfo(google.protobuf.Empty) returns (ServerInfo);
}

message MutationOptions {
  // SDK-generated and stable across a retry of one logical operation.
  string idempotency_key = 1;
  // For revision-fenced commands, a mismatch rejects the mutation. SendPrompt is append-only owner
  // intent and ignores this field so incidental turn progress cannot reject a safe queue append.
  // When omitted, the command is evaluated against authoritative state current at execution time.
  optional uint64 expected_revision = 2;
}

message MutationResult {
  optional string resource_id = 1;
  optional uint64 revision = 2;
}

message Cursor { string server_epoch = 1; uint64 sequence = 2; }
message ServerInfo { string server_version = 1; string api_version = 2; repeated string capabilities = 3; }

message GetWorkspaceRequest { string workspace = 1; optional string session_id = 2; }
// `after` is a resume hint. The server may always answer with a newer full
// replacement snapshot, so clients never need to reduce replay events.
message WatchWorkspaceRequest { string workspace_id = 1; optional Cursor after = 2; }
message ReloadWorkspaceRequest { MutationOptions mutation = 1; string workspace_id = 2; string session_id = 3; }
message GetSoulRequest { string workspace_id = 1; }
message SaveSoulRequest {
  MutationOptions mutation = 1;
  string workspace_id = 2;
  string content = 3;
  // Digest returned by GetSoul. Presence is required for replacement; omission is the deliberate
  // create flow and conflicts if SOUL.md appeared meanwhile.
  optional string expected_digest = 4;
}
message SoulDocument {
  string workspace_id = 1;
  string content = 2;
  string path = 3;
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    SOURCE_FILE = 1;
    SOURCE_MISSING = 2;
  }
  Source source = 4;
  bool exists = 5;
  optional string digest = 6;
}
message WorkspaceSnapshot { Cursor cursor = 1; WorkspaceState state = 2; }

message SessionToolConfiguration {
  repeated ExternalToolDefinition tools = 1;
  bool replace_builtin_tools = 2;
  // Non-empty canonical Nakode builtin names allowed for this session.
  // Omission keeps the runtime default; use replace_builtin_tools to deny every builtin.
  repeated string allowed_builtin_tools = 3;
}

// A fresh session may carry its provider-qualified model, options, and client-owned tool surface in
// the creation mutation. This prevents clients from exposing or sending a first turn through a
// transient configuration. Omitted selection means the workspace/provider default; omitted tools
// keep Nakode's built-ins.
message CreateSessionRequest {
  MutationOptions mutation = 1;
  string workspace_id = 2;
  optional string title = 3;
  // Atomically validated and applied before the logical session is published.
  // Requires the `InitialSessionModel` service capability when set.
  optional string model_id = 4;
  // Invalid without model_id; omission uses that model's own default options.
  ModelOptions options = 5;
  // Atomically validated and installed before publication. Requires `InitialSessionTools`.
  optional SessionToolConfiguration tools = 6;
  // Explicit, deny-by-default Nakode MCP grant; omitted means no MCP access.
  optional McpSessionGrant mcp_grant = 7;
  // Bounded client context merged into Nakode-owned provider system instructions.
  // Omission preserves legacy session creation behavior. Requires `InitialSessionInstructions`.
  optional string initial_instructions = 8;
  // Optional provider-neutral Chat/Agent external-thread projection intent.
  optional SessionBridgeIntent bridge = 9;
  // Filesystem/provider process root for this session. Omission inherits the logical workspace path.
  // The server canonicalizes and persists this directory before publishing the session.
  optional string working_directory = 10;
}
// Supplying tools installs them before a closed session begins provider restoration. An already
// attached session accepts only the identical table, making client reattachment idempotent without
// permitting late reconfiguration.
message SessionBridgeIntent {
  OrchestratorKind kind = 1;
  BridgeLifecycle lifecycle = 2;
  string display_title = 3;
}
enum OrchestratorKind {
  ORCHESTRATOR_KIND_UNSPECIFIED = 0;
  ORCHESTRATOR_KIND_CHAT = 1;
  ORCHESTRATOR_KIND_AGENT = 2;
}
enum BridgeLifecycle {
  BRIDGE_LIFECYCLE_UNSPECIFIED = 0;
  BRIDGE_LIFECYCLE_OPEN = 1;
  BRIDGE_LIFECYCLE_ARCHIVED = 2;
}
message SetSessionBridgeLifecycleRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  BridgeLifecycle lifecycle = 3;
}
message SetWorkspaceBridgeLifecycleRequest {
  MutationOptions mutation = 1;
  string workspace_id = 2;
  BridgeLifecycle lifecycle = 3;
}
message BindSessionBridgeThreadRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string transport = 3;
  string external_parent_id = 4;
  string external_thread_id = 5;
}
message ClearSessionBridgeThreadRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string transport = 3;
  string external_thread_id = 4;
}
message PrepareBridgeDeliveryRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string turn_id = 3;
  string body_sha256 = 4;
  uint64 part_count = 5;
  BridgeProjectionKind projection_kind = 6;
  // Compare-and-set predecessor. An absent value means this must be the first projected item.
  optional BridgeProjection expected_last_projected = 7;
}
message CompleteBridgeDeliveryPartRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string turn_id = 3;
  uint64 part_index = 4;
  string external_message_id = 5;
  BridgeProjectionKind projection_kind = 6;
}
message FinalizeBridgeDeliveryRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string turn_id = 3;
  BridgeProjectionKind projection_kind = 4;
}
message SetBridgeLiveMessageRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  optional string turn_id = 3;
  optional string external_message_id = 4;
  // Clears terminal inbound reaction ownership only when this durable message still owns it.
  optional string clear_active_source_message_id = 5;
}
enum BridgeContinuationDisposition {
  BRIDGE_CONTINUATION_DISPOSITION_UNSPECIFIED = 0;
  BRIDGE_CONTINUATION_DISPOSITION_ACCEPTED = 1;
  BRIDGE_CONTINUATION_DISPOSITION_DUPLICATE = 2;
  BRIDGE_CONTINUATION_DISPOSITION_BUSY = 3;
}
message ContinueSessionFromBridgeResponse {
  MutationResult mutation = 1;
  BridgeContinuationDisposition disposition = 2;
  // Original Accepted/Busy result when disposition is Duplicate. Absent only for identity-only
  // legacy ledger rows whose original status cannot be reconstructed safely.
  optional BridgeContinuationDisposition replayed_disposition = 3;
  // True only while the replayed Accepted source message still owns progress/final reactions.
  optional bool replayed_source_active = 4;
}
message ContinueSessionFromBridgeRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string transport = 3;
  string external_thread_id = 4;
  string external_event_id = 5;
  string source_message_id = 6;
  PromptInput prompt = 7;
  // Consume an authorized event as Busy without starting or queueing work. Used only for bounded
  // transport backpressure; duplicate retries retain the Busy disposition.
  bool consume_as_busy = 8;
}
message OpenSessionRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  optional SessionToolConfiguration tools = 3;
  optional McpSessionGrant mcp_grant = 4;
}
message ListSessionsRequest { string workspace_id = 1; uint32 limit = 2; }
// Removes a logical session and its persisted history. Deletion is AUTHORITATIVE: a
// session still attached is closed and released by the service, because there is no
// close RPC for a caller to issue first and a dead session could never complete one.
// Rejected while work is genuinely in flight behind a live provider, or while the
// current initial-session role still owns a live native provider resource. Closed
// former initial sessions are rotated to a fresh control-plane successor and deleted.
// Requires the `SessionDeletion` capability.
message DeleteSessionRequest { MutationOptions mutation = 1; string session_id = 2; }
message ListSessionsResponse {
  repeated SessionSummary sessions = 1;
  // True only when this response contains the complete canonical logical-session inventory.
  // False covers bounded startup restoration, request truncation, and older servers.
  bool complete = 2;
}
message GetSessionRequest { string session_id = 1; }
message WatchSessionRequest { string session_id = 1; optional Cursor after = 2; }
message SessionSnapshot { Cursor cursor = 1; SessionState state = 2; }

message PromptInput { string text = 1; repeated PromptAttachment attachments = 2; }
message PromptAttachment {
  string label = 1;
  oneof source {
    string artifact_id = 2;
    string local_file = 3;
    InlineImage inline_image = 4;
  }
}
message InlineImage { string media_type = 1; bytes data = 2; }
message SendPromptRequest { MutationOptions mutation = 1; string session_id = 2; PromptInput prompt = 3; }
message EnqueuePromptRequest { MutationOptions mutation = 1; string session_id = 2; PromptInput prompt = 3; }
message RemoveQueuedPromptRequest { MutationOptions mutation = 1; string session_id = 2; string prompt_id = 3; }
message SteerQueuedPromptRequest { MutationOptions mutation = 1; string session_id = 2; string prompt_id = 3; }
message SteerTurnRequest { MutationOptions mutation = 1; string turn_id = 2; string text = 3; }
message CancelTurnRequest { MutationOptions mutation = 1; string turn_id = 2; }
// Priority lifecycle command that cancels all cancellable work owned by the session when the command
// executes, including its active turn, delegated runs, compaction, and shells. Clients that intend
// current-session-work cancellation omit mutation.expected_revision so background progress cannot
// invalidate the request.
message CancelSessionWorkRequest { MutationOptions mutation = 1; string session_id = 2; }
message CompactContextRequest { MutationOptions mutation = 1; string agent_session_id = 2; }
message RunShellRequest { MutationOptions mutation = 1; string session_id = 2; string command = 3; }

enum InteractionResolutionKind {
  INTERACTION_RESOLUTION_KIND_UNSPECIFIED = 0;
  INTERACTION_RESOLUTION_KIND_APPROVE_ONCE = 1;
  INTERACTION_RESOLUTION_KIND_APPROVE_FOR_SESSION = 2;
  INTERACTION_RESOLUTION_KIND_DECLINE = 3;
  INTERACTION_RESOLUTION_KIND_ANSWER = 4;
}
message InteractionAnswer {
  // Stable item identity from InteractionQuestion.id.
  string question_id = 1;
  repeated string option_ids = 2;
  optional string text = 3;
}
message ResolveInteractionRequest {
  MutationOptions mutation = 1;
  string interaction_id = 2;
  InteractionResolutionKind resolution = 3;
  // Legacy single-question option answer.
  repeated string option_ids = 4;
  // Structured answers are validated and committed atomically. Requires `QuestionTextAnswers`.
  repeated InteractionAnswer answers = 5;
}
message ExternalToolDefinition { string name = 1; string description = 2; string input_schema_json = 3; }
message ConfigureSessionToolsRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  repeated ExternalToolDefinition tools = 3;
  bool replace_builtin_tools = 4;
}
message SubmitExternalToolResultRequest {
  MutationOptions mutation = 1;
  string session_id = 2;
  string call_id = 3;
  string output = 4;
  bool failed = 5;
}

enum McpSessionSurface {
  MCP_SESSION_SURFACE_UNSPECIFIED = 0;
  MCP_SESSION_SURFACE_CHAT = 1;
  MCP_SESSION_SURFACE_CODING_AGENT = 2;
}
message McpSessionGrant { McpSessionSurface surface = 1; repeated string server_ids = 2; }
message McpGrantPolicy { bool chat = 1; bool coding_agent = 2; repeated string archetype_slugs = 3; }
message McpServerInput {
  string id = 1;
  string display_name = 2;
  string endpoint = 3;
  string transport = 4;
  bool enabled = 5;
  string auth_kind = 6;
  bool credential_required = 7;
  string protocol_version = 8;
  string provenance_url = 9;
  string provenance_version = 10;
  string provenance_commit = 11;
  string provenance_sha256 = 12;
  string license_evidence = 13;
  uint32 timeout_ms = 14;
  uint32 max_response_bytes = 15;
  string artifact_semantics = 16;
  optional string template_id = 17;
}
message McpTool {
  string remote_name = 1;
  string exposed_name = 2;
  string description = 3;
  string input_schema_json = 4;
  bool app_only = 5;
}
message McpServer {
  string id = 1;
  string workspace_id = 2;
  string display_name = 3;
  string endpoint = 4;
  string transport = 5;
  bool enabled = 6;
  string health = 7;
  bool credential_required = 8;
  bool credential_configured = 9;
  optional string credential_kind = 10;
  string protocol_version = 11;
  optional string server_name = 12;
  optional string server_version = 13;
  string provenance_url = 14;
  string provenance_version = 15;
  string provenance_commit = 16;
  string provenance_sha256 = 17;
  string license_evidence = 18;
  optional string last_error = 19;
  optional uint64 last_connected_at_ms = 20;
  uint64 updated_at_ms = 21;
  uint32 timeout_ms = 22;
  uint32 max_response_bytes = 23;
  string artifact_semantics = 24;
  optional string template_id = 25;
  repeated McpTool tools = 26;
  McpGrantPolicy grants = 27;
}
message McpTemplate {
  string id = 1;
  string display_name = 2;
  string description = 3;
  string endpoint = 4;
  string provenance_url = 5;
  string provenance_version = 6;
  string provenance_commit = 7;
  string provenance_sha256 = 8;
  string license_evidence = 9;
  string artifact_semantics = 10;
  bool credential_required = 11;
}
message McpManagement { string workspace_id = 1; repeated McpServer servers = 2; repeated McpTemplate templates = 3; }
message GetMcpManagementRequest { string workspace_id = 1; }
message SaveMcpServerRequest { MutationOptions mutation = 1; string workspace_id = 2; McpServerInput server = 3; McpGrantPolicy grants = 4; }
message DeleteMcpServerRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; }
message SetMcpServerEnabledRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; bool enabled = 4; }
message RefreshMcpServerRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; }
message SetMcpServerCredentialRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; string kind = 4; string credential = 5; }
message ClearMcpServerCredentialRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; }
message SetMcpServerGrantsRequest { MutationOptions mutation = 1; string workspace_id = 2; string server_id = 3; McpGrantPolicy grants = 4; }

// Redacted installation configuration plus the Discord transport state for the workspace service
// answering this request. Runtime errors are sanitized and never contain credentials, payloads, or
// raw network metadata.
message DiscordIntegration {
  enum RuntimeState {
    RUNTIME_STATE_UNSPECIFIED = 0;
    RUNTIME_STATE_DISABLED = 1;
    RUNTIME_STATE_STOPPED = 2;
    RUNTIME_STATE_RUNNING = 3;
    RUNTIME_STATE_FAILED = 4;
  }
  bool enabled = 1;
  bool configuration_complete = 2;
  bool token_configured = 3;
  optional string chat_channel_id = 4;
  optional string agent_channel_id = 5;
  optional string primary_user_id = 6;
  RuntimeState runtime_state = 7;
  optional string runtime_error = 8;
}
message GetDiscordIntegrationRequest {}
message SaveDiscordIntegrationRequest {
  MutationOptions mutation = 1;
  reserved 2;
  string chat_channel_id = 3;
  string agent_channel_id = 4;
  string primary_user_id = 5;
  // Omission preserves the credential already owned by Nakode. An explicitly present blank value is
  // invalid. This field is never echoed by any response.
  optional string bot_token = 6;
}
message SetDiscordIntegrationEnabledRequest { MutationOptions mutation = 1; bool enabled = 2; }
message RestartDiscordIntegrationRequest { MutationOptions mutation = 1; }

message ModelOptions { optional string reasoning_effort = 1; bool fast_mode = 2; }
message ModelTarget {
  oneof target {
    string provider_default = 1;
    string session_id = 2;
    string agent_session_id = 3;
    bool vision = 4;
  }
}
message SelectModelRequest { MutationOptions mutation = 1; ModelTarget target = 2; string model_id = 3; ModelOptions options = 4; }
message SetProviderEnabledRequest { MutationOptions mutation = 1; string provider_id = 2; bool enabled = 3; }
message SetProviderModelFilterRequest { MutationOptions mutation = 1; string provider_id = 2; bool enabled = 3; repeated string selected_model_ids = 4; }
message BeginProviderAuthenticationRequest { MutationOptions mutation = 1; string provider_id = 2; }
message SetProviderCredentialRequest { MutationOptions mutation = 1; string provider_id = 2; string kind = 3; string credential = 4; }
message ClearProviderCredentialRequest { MutationOptions mutation = 1; string provider_id = 2; }
message ReloadProviderRequest { MutationOptions mutation = 1; string provider_id = 2; }

message AgentDefinitionInput {
  string slug = 1;
  string description = 2;
  string system_prompt = 3;
  string first_message = 4;
  optional string model_id = 5;
  repeated string fallback_models = 6;
  bool fast_mode = 7;
  // Absent means the model's own default, which is what every definition written before this field
  // existed says. A level belongs to `model_id`, so it is refused without one.
  optional string reasoning_effort = 8;
  string ownership = 9;
  optional bool enabled = 10;
  repeated string allowed_capabilities = 11;
  repeated string denied_capabilities = 12;
  repeated string allowed_tools = 13;
  repeated string denied_tools = 14;
  string tool_profile = 15;
  string task_shape = 16;
  string output_contract = 17;
  optional uint32 timeout_seconds = 18;
  optional uint32 poll_interval_ms = 19;
  optional uint32 max_turns = 20;
  uint32 max_concurrency = 21;
  string fallback_policy = 22;
  bool can_delegate = 23;
  uint32 max_delegation_depth = 24;
  optional bool require_parent_attribution = 25;
}
message SaveAgentRequest { MutationOptions mutation = 1; string workspace_id = 2; AgentDefinitionInput definition = 3; optional string previous_slug = 4; }
message DeleteAgentRequest { MutationOptions mutation = 1; string workspace_id = 2; string slug = 3; }
message CheckAgentBrowserRequest { MutationOptions mutation = 1; string workspace_id = 2; }

message WebSettingsPatch { string backend = 1; optional string credential = 2; }
message MemorySettingsPatch { string backend = 1; optional string executable = 2; optional string global_bank = 3; optional string data_directory = 4; }
message VisionSettingsPatch { optional string model_id = 1; bool clear_model = 2; }
message TerminalImagesSettingsPatch { string mode = 1; }
message InvocationTelemetrySettingsPatch { bool enabled = 1; }
message SettingsPatch {
  oneof patch {
    WebSettingsPatch web = 1;
    MemorySettingsPatch memory = 2;
    VisionSettingsPatch vision = 3;
    TerminalImagesSettingsPatch terminal_images = 4;
    InvocationTelemetrySettingsPatch invocation_telemetry = 5;
  }
}
message UpdateSettingsRequest { MutationOptions mutation = 1; SettingsPatch patch = 2; }

message DelegateRequest { MutationOptions mutation = 1; string session_id = 2; string agent_slug = 3; string task = 4; optional string parent_run_id = 5; }
message ListRunsRequest { string session_id = 1; optional string before_run_id = 2; uint32 limit = 3; }
message ListRunsResponse { repeated RunState runs = 1; bool has_earlier = 2; }
message GetRunRequest { string run_id = 1; }
message WatchRunRequest { string run_id = 1; optional Cursor after = 2; }
message RunSnapshot { Cursor cursor = 1; RunState state = 2; }
message CancelRunRequest { MutationOptions mutation = 1; string run_id = 2; }

enum TranscriptOwnerKind { TRANSCRIPT_OWNER_KIND_UNSPECIFIED = 0; TRANSCRIPT_OWNER_KIND_SESSION = 1; TRANSCRIPT_OWNER_KIND_RUN = 2; }
message GetTranscriptPageRequest { TranscriptOwnerKind owner_kind = 1; string owner_id = 2; optional string before_entry_id = 3; uint32 limit = 4; }
message GetTranscriptBodyWindowRequest { TranscriptOwnerKind owner_kind = 1; string owner_id = 2; string entry_id = 3; optional uint64 before_byte = 4; uint32 limit_bytes = 5; }
enum RunTextField { RUN_TEXT_FIELD_UNSPECIFIED = 0; RUN_TEXT_FIELD_OBJECTIVE = 1; RUN_TEXT_FIELD_LATEST_ACTIVITY = 2; RUN_TEXT_FIELD_OUTCOME = 3; RUN_TEXT_FIELD_RESULT = 4; }
message GetRunTextWindowRequest { string run_id = 1; RunTextField field = 2; optional uint64 before_byte = 3; uint32 limit_bytes = 4; }
message GetArtifactRequest { string artifact_id = 1; }
message GetDiagnosticsRequest { uint32 days = 1; uint32 session_limit = 2; optional string provider_id = 3; }
message GetInvocationSummaryRequest {}
message GetInvocationTimelineRequest {
  uint64 start_at_ms = 1;
  uint64 end_at_ms = 2;
  uint64 bucket_width_ms = 3;
}

message WorkspaceState {
  string workspace_id = 1;
  string workspace_path = 2;
  repeated Provider providers = 3;
  repeated Model models = 4;
  repeated AgentDefinition agents = 5;
  repeated Skill skills = 6;
  Settings settings = 7;
  repeated SessionSummary sessions = 8;
  optional SessionState active_session = 9;
  repeated SessionBridge session_bridges = 10;
}

enum BridgeProjectionKind {
  BRIDGE_PROJECTION_KIND_UNSPECIFIED = 0;
  BRIDGE_PROJECTION_KIND_USER = 1;
  BRIDGE_PROJECTION_KIND_ASSISTANT = 2;
}
message BridgeProjection {
  BridgeProjectionKind kind = 1;
  string turn_id = 2;
}
message BridgeDelivery {
  string turn_id = 1;
  string body_sha256 = 2;
  uint64 part_count = 3;
  uint64 completed_parts = 4;
  optional string last_external_message_id = 5;
  BridgeProjectionKind projection_kind = 6;
  optional BridgeProjection previous_projection = 7;
}
message SessionBridge {
  string session_id = 1;
  string workspace_id = 2;
  OrchestratorKind kind = 3;
  BridgeLifecycle lifecycle = 4;
  string display_title = 5;
  // Monotonic bridge-local projection revision. This is distinct from
  // MutationOptions.expected_revision, which targets the owning session engine revision.
  uint64 revision = 6;
  optional string transport = 7;
  optional string external_parent_id = 8;
  optional string external_thread_id = 9;
  reserved 10;
  optional BridgeDelivery delivery = 11;
  optional string live_turn_id = 12;
  optional string live_external_message_id = 13;
  optional string active_source_message_id = 14;
  // Last user or assistant transcript item durably projected to the bound transport.
  optional BridgeProjection last_projected = 15;
}

message ProviderCapabilities { repeated ProviderCapability supported = 1; }
enum ProviderCapability {
  PROVIDER_CAPABILITY_UNSPECIFIED = 0;
  PROVIDER_CAPABILITY_RESUME = 1;
  PROVIDER_CAPABILITY_STEERING = 2;
  PROVIDER_CAPABILITY_INTERRUPTION = 3;
  PROVIDER_CAPABILITY_MODEL_CATALOG = 4;
  PROVIDER_CAPABILITY_MODELS_REQUIRE_SESSION = 5;
  PROVIDER_CAPABILITY_SESSION_MODEL_CONFIGURATION = 6;
  PROVIDER_CAPABILITY_CONTEXT_COMPACTION = 7;
  PROVIDER_CAPABILITY_APPROVALS = 8;
  PROVIDER_CAPABILITY_NATIVE_TOOLS = 9;
  PROVIDER_CAPABILITY_MCP = 10;
  PROVIDER_CAPABILITY_CLOSE_SESSION = 11;
  PROVIDER_CAPABILITY_EXTERNAL_TOOLS = 12;
}
enum ConnectionState { CONNECTION_STATE_UNSPECIFIED = 0; CONNECTION_STATE_DISABLED = 1; CONNECTION_STATE_STARTING = 2; CONNECTION_STATE_READY = 3; CONNECTION_STATE_FAILED = 4; CONNECTION_STATE_DISCONNECTED = 5; }
message Connection { ConnectionState state = 1; optional string message = 2; }
message ProviderAuthentication { enum Kind { KIND_UNSPECIFIED = 0; KIND_STARTING = 1; KIND_API_KEY_REQUIRED = 2; KIND_CHALLENGE = 3; } Kind kind = 1; optional string dashboard_url = 2; optional string credential_kind = 3; optional string verification_url = 4; optional string user_code = 5; }
message Provider { string id = 1; string display_name = 2; bool enabled = 3; bool credential_configured = 4; optional string credential_kind = 5; Connection connection = 6; ProviderCapabilities capabilities = 7; optional ProviderAuthentication authentication = 8; bool model_filter_enabled = 9; repeated string selected_model_ids = 10; repeated Model model_candidates = 11; }
message ModelConfiguration { repeated string reasoning_efforts = 1; bool fast_mode_configurable = 2; bool vision_eligible = 3; bool accepts_image_input = 4; }
message Model { string id = 1; string provider_id = 2; string model_slug = 3; string display_name = 4; bool is_default = 5; optional string reasoning_effort = 6; bool fast_mode = 7; ModelConfiguration configuration = 8; }
message AgentDefinition {
  string slug = 1;
  string description = 2;
  string system_prompt = 3;
  string first_message = 4;
  optional string model_id = 5;
  repeated string fallback_models = 6;
  bool fast_mode = 7;
  optional string reasoning_effort = 8;
  string ownership = 9;
  optional bool enabled = 10;
  repeated string allowed_capabilities = 11;
  repeated string denied_capabilities = 12;
  repeated string allowed_tools = 13;
  repeated string denied_tools = 14;
  string tool_profile = 15;
  string task_shape = 16;
  string output_contract = 17;
  optional uint32 timeout_seconds = 18;
  optional uint32 poll_interval_ms = 19;
  optional uint32 max_turns = 20;
  uint32 max_concurrency = 21;
  string fallback_policy = 22;
  bool can_delegate = 23;
  uint32 max_delegation_depth = 24;
  optional bool require_parent_attribution = 25;
  // Interpreted by Nakode from the configured policy above. `*_uses_runtime_default` distinguishes
  // an intentionally ambiguous legacy default from an exact empty boundary.
  repeated string effective_builtin_tools = 26;
  bool effective_builtin_tools_uses_runtime_default = 27;
  repeated string effective_capabilities = 28;
  bool effective_capabilities_use_runtime_default = 29;
  repeated string policy_warnings = 30;
  bool dashboard_tools_injected = 31;
  uint32 policy_projection_version = 32;
}
message Skill { string name = 1; string description = 2; }

message WebSettings { string backend = 1; bool credential_configured = 2; AgentBrowser agent_browser = 3; }
message AgentBrowser { enum State { STATE_UNSPECIFIED = 0; STATE_CHECKING = 1; STATE_AVAILABLE = 2; STATE_UNAVAILABLE = 3; } State state = 1; optional string version = 2; }
message MemorySettings { string backend = 1; string executable = 2; string global_bank = 3; string data_directory = 4; bool configured = 5; bool available = 6; }
message VisionSettings { optional string model_id = 1; }
enum TerminalImageMode { TERMINAL_IMAGE_MODE_UNSPECIFIED = 0; TERMINAL_IMAGE_MODE_AUTO = 1; TERMINAL_IMAGE_MODE_ON = 2; TERMINAL_IMAGE_MODE_OFF = 3; }
message Settings {
  WebSettings web = 1;
  MemorySettings memory = 2;
  VisionSettings vision = 3;
  TerminalImageMode terminal_images = 4;
  bool invocation_telemetry_enabled = 5;
}

message OwnedProviderSession { string provider_id = 1; string native_session_id = 2; }
message SessionSummary {
  string id = 1;
  string workspace_id = 2;
  string title = 3;
  optional string active_provider_id = 4;
  optional string active_model_id = 5;
  // Unix epoch milliseconds. Persistence stores seconds and the server converts exactly once.
  int64 updated_at_ms = 6;
  // Opaque provider resources claimed by this logical session. Clients use these only to suppress
  // duplicate native discovery; lifecycle mutations continue to address Nakode.
  repeated OwnedProviderSession owned_provider_sessions = 7;
  // True while the service still owns work in flight for this logical session.
  bool running = 8;
  // Unix epoch milliseconds. The immutable logical-session creation boundary.
  int64 created_at_ms = 9;
  // Canonical filesystem/provider process root, independent from logical workspace ownership.
  string working_directory = 10;
}
enum SessionActivity { SESSION_ACTIVITY_UNSPECIFIED = 0; SESSION_ACTIVITY_IDLE = 1; SESSION_ACTIVITY_CREATING_AGENT_SESSION = 2; SESSION_ACTIVITY_STARTING_TURN = 3; SESSION_ACTIVITY_RUNNING_TURN = 4; SESSION_ACTIVITY_COMPACTING_CONTEXT = 5; SESSION_ACTIVITY_RUNNING_DELEGATES = 6; SESSION_ACTIVITY_RUNNING_SHELL = 7; }
message TokenUsage { uint64 input_tokens = 1; uint64 output_tokens = 2; uint64 cached_input_tokens = 3; uint64 cache_write_tokens = 4; }
message AgentSession {
  string id = 1;
  string provider_id = 2;
  optional string model_id = 3;
  string role = 4;
  ProviderCapabilities capabilities = 5;
  Connection connection = 6;
  // Opaque provider resume identity. Nakode remains the lifecycle owner.
  optional string native_session_id = 7;
  // Normalized provider-worker transcript for read-only child inspection.
  TranscriptPage transcript = 8;
  TokenUsage usage = 9;
}
enum TurnStatus { TURN_STATUS_UNSPECIFIED = 0; TURN_STATUS_STARTING = 1; TURN_STATUS_RUNNING = 2; TURN_STATUS_CANCELLING = 3; TURN_STATUS_COMPLETED = 4; TURN_STATUS_INTERRUPTED = 5; TURN_STATUS_FAILED = 6; }
message Turn {
  string id = 1;
  string agent_session_id = 2;
  optional string model_id = 3;
  TurnStatus status = 4;
  // Concrete options captured when this owner turn was accepted. They never follow later selection changes.
  ModelOptions resolved_model_options = 5;
}
message ContextUsage { uint64 estimated_tokens = 1; optional uint64 context_window = 2; bool compacting = 3; }
message SessionState {
  string id = 1;
  uint64 revision = 2;
  string workspace_id = 3;
  string title = 4;
  string status_message = 5;
  uint64 diagnostic_count = 6;
  SessionActivity activity = 7;
  optional string selected_provider_id = 8;
  optional string selected_model_id = 9;
  optional AgentSession active_agent_session = 10;
  optional Turn active_turn = 11;
  optional ContextUsage context_usage = 12;
  TranscriptPage transcript = 13;
  optional RecoverablePrompt recoverable_prompt = 14;
  repeated QueueItem queue = 15;
  repeated Interaction interactions = 16;
  repeated TodoPhase todos = 17;
  repeated RunState runs = 18;
  bool runs_has_earlier = 19;
  repeated Notice notices = 20;
  repeated ExternalToolCall external_tool_calls = 21;
  // Effective model options for this logical session, including a session-local override.
  ModelOptions selected_model_options = 22;
  // Unix epoch milliseconds from Nakode's persisted logical-session record.
  int64 created_at_ms = 23;
  int64 updated_at_ms = 24;
  // Most recent terminal owner turn. Delegated child runs are represented only in `runs`.
  optional Turn last_turn = 25;
  // True only when the selected next-turn configuration differs from the owner turn in flight.
  bool next_turn_configuration_pending = 26;
  // Server-authored transition semantics for the selected next-turn configuration.
  optional string next_turn_transition = 27;
  // All delegated runs owned by this logical session before the bounded `runs` projection.
  // Includes direct runs and recursively delegated descendants. Presence distinguishes a real zero
  // from an older server that predates this field.
  optional uint64 runs_total = 28;
  // Canonical filesystem/provider process root, independent from logical workspace ownership.
  string working_directory = 29;
}
message ExternalToolCall { string id = 1; string name = 2; string arguments_json = 3; }

enum TranscriptEntryKind { TRANSCRIPT_ENTRY_KIND_UNSPECIFIED = 0; TRANSCRIPT_ENTRY_KIND_SYSTEM = 1; TRANSCRIPT_ENTRY_KIND_USER = 2; TRANSCRIPT_ENTRY_KIND_ASSISTANT = 3; TRANSCRIPT_ENTRY_KIND_STEERING = 4; TRANSCRIPT_ENTRY_KIND_REASONING = 5; TRANSCRIPT_ENTRY_KIND_TOOL = 6; TRANSCRIPT_ENTRY_KIND_DIFF = 7; TRANSCRIPT_ENTRY_KIND_WARNING = 8; TRANSCRIPT_ENTRY_KIND_ERROR = 9; }
enum TranscriptEntryStatus { TRANSCRIPT_ENTRY_STATUS_UNSPECIFIED = 0; TRANSCRIPT_ENTRY_STATUS_RUNNING = 1; TRANSCRIPT_ENTRY_STATUS_COMPLETE = 2; TRANSCRIPT_ENTRY_STATUS_FAILED = 3; TRANSCRIPT_ENTRY_STATUS_INTERRUPTED = 4; }
message TranscriptEntry {
  string id = 1; TranscriptEntryKind kind = 2; string title = 3; string body = 4;
  uint64 body_start_byte = 5; uint64 body_total_bytes = 6; TranscriptEntryStatus status = 7;
  repeated string artifact_ids = 8; optional string provider_id = 9; optional string model_id = 10;
  // Opaque, versioned audit envelope. Its payload fields carry explicit truncation/redaction metadata.
  optional string tool_audit_json = 11;
  // Immutable server creation boundary. Absent for imported history without source timing.
  optional uint64 created_at_ms = 12;
  // Immutable owner-turn attribution. Absent for user/system/delegate or legacy entries.
  optional string owner_turn_id = 13;
  optional string resolved_reasoning_effort = 14;
  optional bool resolved_fast_mode = 15;
  // External transport that originated this user turn. Absent for dashboard/SDK-origin input.
  optional string source_transport = 16;
}
message TranscriptPage {
  repeated TranscriptEntry entries = 1;
  bool has_earlier = 2;
  bool stream_active = 3;
  string stream_label = 4;
  // Additive latest-owner anchor with normal body bounds. The same stable ID may also occur in entries;
  // presentation clients that pin this row should render it once by ID.
  optional TranscriptEntry current_owner_entry = 5;
  // Exact tool/diff rows from that owner turn omitted from entries.
  uint64 current_owner_omitted_tool_calls = 6;
}
message TranscriptBodyWindow { string entry_id = 1; string body = 2; uint64 start_byte = 3; uint64 total_bytes = 4; bool has_earlier = 5; }
message QueueItem { string id = 1; string summary = 2; uint32 attachment_count = 3; string text = 4; bool redirecting = 5; }
message RecoverablePrompt { string id = 1; string text = 2; repeated PromptAttachment attachments = 3; }

enum InteractionKind { INTERACTION_KIND_UNSPECIFIED = 0; INTERACTION_KIND_APPROVAL = 1; INTERACTION_KIND_QUESTION = 2; }
enum InteractionStatus { INTERACTION_STATUS_UNSPECIFIED = 0; INTERACTION_STATUS_PENDING = 1; INTERACTION_STATUS_RESOLVED = 2; INTERACTION_STATUS_DECLINED = 3; INTERACTION_STATUS_CANCELLED = 4; }
message InteractionOption { string id = 1; string label = 2; optional string description = 3; bool recommended = 4; }
message InteractionQuestion { string id = 1; string title = 2; string detail = 3; repeated InteractionOption options = 4; bool multiple = 5; }
message Interaction {
  string id = 1; uint64 revision = 2; InteractionKind kind = 3; InteractionStatus status = 4;
  // Legacy scalar shape mirrors the first question for old clients.
  string title = 5; string detail = 6; repeated InteractionOption options = 7; bool multiple = 8;
  repeated InteractionQuestion questions = 9;
}
enum TodoStatus { TODO_STATUS_UNSPECIFIED = 0; TODO_STATUS_PENDING = 1; TODO_STATUS_IN_PROGRESS = 2; TODO_STATUS_COMPLETED = 3; TODO_STATUS_ABANDONED = 4; }
message TodoItem { string content = 1; TodoStatus status = 2; }
message TodoPhase { string name = 1; repeated TodoItem tasks = 2; }
enum NoticeLevel { NOTICE_LEVEL_UNSPECIFIED = 0; NOTICE_LEVEL_INFO = 1; NOTICE_LEVEL_WARNING = 2; NOTICE_LEVEL_ERROR = 3; }
message Notice { string id = 1; NoticeLevel level = 2; string message = 3; }

enum RunStatus { RUN_STATUS_UNSPECIFIED = 0; RUN_STATUS_STARTING = 1; RUN_STATUS_WORKING = 2; RUN_STATUS_COMPLETED = 3; RUN_STATUS_INTERRUPTED = 4; RUN_STATUS_FAILED = 5; }
message RunOutcome { enum Kind { KIND_UNSPECIFIED = 0; KIND_COMPLETED = 1; KIND_FAILED = 2; KIND_INTERRUPTED = 3; } Kind kind = 1; string body = 2; }
message RunPolicy {
  repeated string allowed_capabilities = 1;
  repeated string denied_capabilities = 2;
  repeated string allowed_tools = 3;
  repeated string denied_tools = 4;
  string tool_profile = 5;
  string task_shape = 6;
  string output_contract = 7;
  optional uint32 timeout_seconds = 8;
  optional uint32 max_turns = 9;
  bool can_delegate = 10;
  uint32 max_delegation_depth = 11;
  uint32 remaining_delegation_depth = 12;
  bool require_parent_attribution = 13;
  repeated string truncated_fields = 14;
  string provider = 15;
  repeated string provider_allowed_tools = 16;
  repeated string unsupported_canonical_tools = 17;
  bool provider_tools_restricted = 18;
  bool policy_available = 19;
}
message RunToolDenial {
  string entry_id = 1;
  string tool = 2;
  string reason = 3;
  uint64 tool_start_byte = 4;
  uint64 tool_total_bytes = 5;
  uint64 reason_start_byte = 6;
  uint64 reason_total_bytes = 7;
}
message RunState {
  string id = 1;
  string agent_slug = 2;
  string provider_id = 3;
  string objective = 4;
  uint64 objective_start_byte = 5;
  uint64 objective_total_bytes = 6;
  RunStatus status = 7;
  string latest_activity = 8;
  uint64 latest_activity_start_byte = 9;
  uint64 latest_activity_total_bytes = 10;
  optional RunOutcome outcome = 11;
  uint64 outcome_start_byte = 12;
  uint64 outcome_total_bytes = 13;
  optional string result = 14;
  uint64 result_start_byte = 15;
  uint64 result_total_bytes = 16;
  TranscriptPage transcript = 17;
  optional string model_id = 18;
  optional string native_session_id = 19;
  TokenUsage usage = 20;
  optional string parent_run_id = 21;
  string archetype_purpose = 22;
  optional string reasoning_effort = 23;
  bool fast_mode = 24;
  uint64 started_at_ms = 25;
  optional uint64 ended_at_ms = 26;
  optional uint64 duration_ms = 27;
  optional string termination_kind = 28;
  optional string termination_detail = 29;
  optional string objective_mismatch_handoff = 30;
  RunPolicy policy = 31;
  repeated RunToolDenial tool_denials = 32;
  uint32 tool_denials_retained_total = 33;
}
message RunTextWindow { string run_id = 1; RunTextField field = 2; string text = 3; uint64 start_byte = 4; uint64 total_bytes = 5; bool has_earlier = 6; }
message Artifact { string id = 1; string label = 2; string media_type = 3; uint64 byte_length = 4; bytes data = 5; }

message DiagnosticsUsageTotals { uint64 inference_rounds = 1; uint64 compaction_rounds = 2; uint64 failed_rounds = 3; uint64 retry_count = 4; uint64 estimated_input_tokens = 5; uint64 reported_input_tokens = 6; uint64 reported_cached_input_tokens = 7; uint64 reported_cache_write_tokens = 8; uint64 reported_output_tokens = 9; uint64 request_bytes = 10; uint64 response_bytes = 11; uint64 inference_duration_ms = 12; uint64 requested_tool_calls = 13; uint64 executed_tool_calls = 14; uint64 failed_tool_calls = 15; uint64 full_tool_output_bytes = 16; uint64 model_tool_output_bytes = 17; uint64 tool_duration_ms = 18; }
