  SESSION_FAILURE_PHASE_UNSPECIFIED = 0;
  SESSION_FAILURE_PHASE_PROVIDER_INITIALIZATION = 1;
  SESSION_FAILURE_PHASE_AUTHENTICATION = 2;
  SESSION_FAILURE_PHASE_MODEL_DISCOVERY = 3;
  SESSION_FAILURE_PHASE_SESSION_START = 4;
  SESSION_FAILURE_PHASE_SESSION_RESUME = 5;
  SESSION_FAILURE_PHASE_TURN_START = 6;
  SESSION_FAILURE_PHASE_CONTEXT_COMPACTION = 7;
  SESSION_FAILURE_PHASE_LOCAL_SERVICE = 8;
}
enum SessionFailureClassification {
  SESSION_FAILURE_CLASSIFICATION_UNSPECIFIED = 0;
  SESSION_FAILURE_CLASSIFICATION_TIMEOUT = 1;
  SESSION_FAILURE_CLASSIFICATION_DNS = 2;
  SESSION_FAILURE_CLASSIFICATION_CONNECTIVITY = 3;
  SESSION_FAILURE_CLASSIFICATION_TLS = 4;
  SESSION_FAILURE_CLASSIFICATION_AUTHENTICATION = 5;
  SESSION_FAILURE_CLASSIFICATION_AUTHORIZATION = 6;
  SESSION_FAILURE_CLASSIFICATION_HTTP_STATUS = 7;
  SESSION_FAILURE_CLASSIFICATION_MALFORMED_RESPONSE = 8;
  SESSION_FAILURE_CLASSIFICATION_PROVIDER_UNAVAILABLE = 9;
  SESSION_FAILURE_CLASSIFICATION_LOCAL_SERVICE = 10;
  SESSION_FAILURE_CLASSIFICATION_TRANSPORT = 11;
}
message SessionFailure {
  // A logical session exists, but no usable provider conversation was established.
  bool initial_start = 1;
  SessionFailurePhase phase = 2;
  SessionFailureClassification classification = 3;
  string summary = 4;
  optional string provider_id = 5;
  string operation = 6;
  // Scheme, authority and path only. Userinfo, query and fragment are prohibited.
  optional string safe_endpoint = 7;
  optional uint32 http_status = 8;
  // Sanitized provider/runtime causes, ordered outermost to innermost and bounded by the server.
  repeated string source_chain = 9;
  optional string correlation_id = 10;
}
message ProviderAccountRoutingDiagnostic {
  optional string account_id = 1;
  optional string account_label = 2;
  string reason = 3;
  optional uint64 cooldown_until_ms = 4;
}
message ExternalToolCall { string id = 1; string name = 2; string arguments_json = 3; }

enum TranscriptEntryKind { TRANSCRIPT_ENTRY_KIND_UNSPECIFIED = 0; TRANSCRIPT_ENTRY_KIND_SYSTEM = 1; TRANSCRIPT_ENTRY_KIND_USER = 2; TRANSCRIPT_ENTRY_KIND_ASSISTANT = 3; TRANSCRIPT_ENTRY_KIND_STEERING = 4; TRANSCRIPT_ENTRY_KIND_REASONING = 5; TRANSCRIPT_ENTRY_KIND_TOOL = 6; TRANSCRIPT_ENTRY_KIND_DIFF = 7; TRANSCRIPT_ENTRY_KIND_WARNING = 8; TRANSCRIPT_ENTRY_KIND_ERROR = 9; }
enum TranscriptEntryStatus { TRANSCRIPT_ENTRY_STATUS_UNSPECIFIED = 0; TRANSCRIPT_ENTRY_STATUS_RUNNING = 1; TRANSCRIPT_ENTRY_STATUS_COMPLETE = 2; TRANSCRIPT_ENTRY_STATUS_FAILED = 3; TRANSCRIPT_ENTRY_STATUS_INTERRUPTED = 4; }
message TranscriptEntry {
  string id = 1; TranscriptEntryKind kind = 2; string title = 3; string body = 4;
  uint64 body_start_byte = 5; uint64 body_total_bytes = 6; TranscriptEntryStatus status = 7;
  repeated string artifact_ids = 8; optional string provider_id = 9; optional string model_id = 10;
  // Opaque, versioned audit envelope. Its payload fields carry explicit truncation/redaction metadata.
  optional string tool_audit_json = 11;
  // Immutable server creation boundary. Absent for imported history without source timing.
  optional uint64 created_at_ms = 12;
  // Immutable owner-turn attribution. Absent for user/system/delegate or legacy entries.
  optional string owner_turn_id = 13;
  optional string resolved_reasoning_effort = 14;
  optional bool resolved_fast_mode = 15;
  // External transport that originated this user turn. Absent for dashboard/SDK-origin input.
  optional string source_transport = 16;
  // Stable caller-owned prompt/mutation identity. Absent for legacy/imported owner entries.
  optional string source_prompt_id = 17;
  // Parent tool transcript entry for one server-attributed nested invocation.
  optional string parent_tool_entry_id = 18;
}
message TranscriptPage {
  repeated TranscriptEntry entries = 1;
  bool has_earlier = 2;
  bool stream_active = 3;
  string stream_label = 4;
  // Additive latest-owner anchor with normal body bounds. The same stable ID may also occur in entries;
  // presentation clients that pin this row should render it once by ID.
  optional TranscriptEntry current_owner_entry = 5;
  // Exact tool/diff rows from that owner turn omitted from entries.
  uint64 current_owner_omitted_tool_calls = 6;
}
message TranscriptBodyWindow { string entry_id = 1; string body = 2; uint64 start_byte = 3; uint64 total_bytes = 4; bool has_earlier = 5; }
message QueueItem { string id = 1; string summary = 2; uint32 attachment_count = 3; string text = 4; bool redirecting = 5; }
message RecoverablePrompt { string id = 1; string text = 2; repeated PromptAttachment attachments = 3; }

enum InteractionKind { INTERACTION_KIND_UNSPECIFIED = 0; INTERACTION_KIND_APPROVAL = 1; INTERACTION_KIND_QUESTION = 2; }
enum InteractionStatus { INTERACTION_STATUS_UNSPECIFIED = 0; INTERACTION_STATUS_PENDING = 1; INTERACTION_STATUS_RESOLVED = 2; INTERACTION_STATUS_DECLINED = 3; INTERACTION_STATUS_CANCELLED = 4; }
message InteractionOption { string id = 1; string label = 2; optional string description = 3; bool recommended = 4; }
message InteractionQuestion { string id = 1; string title = 2; string detail = 3; repeated InteractionOption options = 4; bool multiple = 5; }
message Interaction {
  string id = 1; uint64 revision = 2; InteractionKind kind = 3; InteractionStatus status = 4;
  // Legacy scalar shape mirrors the first question for old clients.
  string title = 5; string detail = 6; repeated InteractionOption options = 7; bool multiple = 8;
  repeated InteractionQuestion questions = 9;
}
enum TodoStatus { TODO_STATUS_UNSPECIFIED = 0; TODO_STATUS_PENDING = 1; TODO_STATUS_IN_PROGRESS = 2; TODO_STATUS_COMPLETED = 3; TODO_STATUS_ABANDONED = 4; }
message TodoItem { string content = 1; TodoStatus status = 2; }
message TodoPhase { string name = 1; repeated TodoItem tasks = 2; }
enum NoticeLevel { NOTICE_LEVEL_UNSPECIFIED = 0; NOTICE_LEVEL_INFO = 1; NOTICE_LEVEL_WARNING = 2; NOTICE_LEVEL_ERROR = 3; }
message Notice { string id = 1; NoticeLevel level = 2; string message = 3; }

enum RunStatus { RUN_STATUS_UNSPECIFIED = 0; RUN_STATUS_STARTING = 1; RUN_STATUS_WORKING = 2; RUN_STATUS_COMPLETED = 3; RUN_STATUS_INTERRUPTED = 4; RUN_STATUS_FAILED = 5; RUN_STATUS_PARTIAL = 6; }
message RunOutcome { enum Kind { KIND_UNSPECIFIED = 0; KIND_COMPLETED = 1; KIND_FAILED = 2; KIND_INTERRUPTED = 3; KIND_PARTIAL = 4; } Kind kind = 1; string body = 2; }
message RunPolicy {
  repeated string allowed_capabilities = 1;
  repeated string denied_capabilities = 2;
  repeated string allowed_tools = 3;
  repeated string denied_tools = 4;
  string tool_profile = 5;
  string task_shape = 6;
  string output_contract = 7;
  optional uint32 timeout_seconds = 8;
  optional uint32 max_turns = 9;
  bool can_delegate = 10;
  uint32 max_delegation_depth = 11;
  uint32 remaining_delegation_depth = 12;
  bool require_parent_attribution = 13;
  repeated string truncated_fields = 14;
  string provider = 15;
  repeated string provider_allowed_tools = 16;
  repeated string unsupported_canonical_tools = 17;
  bool provider_tools_restricted = 18;
  bool policy_available = 19;
}
message RunToolDenial {
  string entry_id = 1;
  string tool = 2;
  string reason = 3;
  uint64 tool_start_byte = 4;
  uint64 tool_total_bytes = 5;
  uint64 reason_start_byte = 6;
  uint64 reason_total_bytes = 7;
}
message SalvagedEvidence {
  string entry_id = 1;
  string title = 2;
  string body = 3;
  bool truncated = 4;
}
message ContinuationProposition {
  repeated string verified_findings = 1;
  string unresolved_boundary = 2;
  string why_it_matters = 3;
  string recommended_archetype = 4;
  string follow_up_objective = 5;
  repeated string inherited_evidence = 6;
  bool can_proceed_independently = 7;
}
message RunSalvage {
  string terminal_reason = 1;
  string original_objective = 2;
  repeated string completed_work = 3;
  repeated SalvagedEvidence verified_evidence = 4;
  optional SalvagedEvidence last_successful_evidence = 5;
  repeated string unresolved_questions = 6;
  ContinuationProposition continuation = 7;
  bool can_resume = 8;
  bool redacted = 9;
  bool truncated = 10;
}
message SharedContextUtilization {
  uint32 briefing_entries = 1;
  uint32 briefing_bytes = 2;
  bool briefing_fallback = 3;
  uint32 search_count = 4;
  uint32 search_results = 5;
  uint64 search_duration_ms = 6;
}
message SharedContextBriefingEntry {
  uint64 source_sequence = 1;
  string source_id = 2;
  optional string source_author_run_id = 3;
  string source_author_label = 4;
  string kind = 5;
  string delivered_body = 6;
  uint32 source_body_bytes = 7;
  uint32 delivered_body_bytes = 8;
  bool truncated = 9;
  bool fallback = 10;
}
message SharedContextBriefing {
  string task_packet = 1;
  uint64 captured_at_ms = 2;
  repeated SharedContextBriefingEntry entries = 3;
  bool fallback = 4;
  uint32 delivered_bytes = 5;
}
message RunState {
  string id = 1;
  string agent_slug = 2;
  string provider_id = 3;
  string objective = 4;
  uint64 objective_start_byte = 5;
  uint64 objective_total_bytes = 6;
  RunStatus status = 7;
  string latest_activity = 8;
  uint64 latest_activity_start_byte = 9;
  uint64 latest_activity_total_bytes = 10;
  optional RunOutcome outcome = 11;
  uint64 outcome_start_byte = 12;
  uint64 outcome_total_bytes = 13;
  optional string result = 14;
  uint64 result_start_byte = 15;
  uint64 result_total_bytes = 16;
  TranscriptPage transcript = 17;
  optional string model_id = 18;
  optional string native_session_id = 19;
  TokenUsage usage = 20;
  optional string parent_run_id = 21;
  string archetype_purpose = 22;
  optional string reasoning_effort = 23;
  bool fast_mode = 24;
  uint64 started_at_ms = 25;
  optional uint64 ended_at_ms = 26;
  optional uint64 duration_ms = 27;
  optional string termination_kind = 28;
  optional string termination_detail = 29;
  optional string objective_mismatch_handoff = 30;
  RunPolicy policy = 31;
  repeated RunToolDenial tool_denials = 32;
  uint32 tool_denials_retained_total = 33;
  optional RunSalvage salvage = 34;
  optional string continued_from_run_id = 35;
  optional string continued_by_run_id = 36;
  uint32 continuation_depth = 37;
  optional uint32 additional_turns = 38;
  repeated SalvagedEvidence inherited_evidence = 39;
  optional string invocation_turn_id = 40;
  optional string invocation_call_id = 41;
  optional TranscriptEntry originating_owner_entry = 42;
  SharedContextUtilization shared_context_utilization = 43;
  optional SharedContextBriefing shared_context_briefing = 44;
}
message RunTextWindow { string run_id = 1; RunTextField field = 2; string text = 3; uint64 start_byte = 4; uint64 total_bytes = 5; bool has_earlier = 6; }
message Artifact { string id = 1; string label = 2; string media_type = 3; uint64 byte_length = 4; bytes data = 5; }

message DiagnosticsUsageTotals { uint64 inference_rounds = 1; uint64 compaction_rounds = 2; uint64 failed_rounds = 3; uint64 retry_count = 4; uint64 estimated_input_tokens = 5; uint64 reported_input_tokens = 6; uint64 reported_cached_input_tokens = 7; uint64 reported_cache_write_tokens = 8; uint64 reported_output_tokens = 9; uint64 request_bytes = 10; uint64 response_bytes = 11; uint64 inference_duration_ms = 12; uint64 requested_tool_calls = 13; uint64 executed_tool_calls = 14; uint64 failed_tool_calls = 15; uint64 full_tool_output_bytes = 16; uint64 model_tool_output_bytes = 17; uint64 tool_duration_ms = 18; }
message DiagnosticsDailyUsage { string date_utc = 1; string provider_id = 2; DiagnosticsUsageTotals totals = 3; }
message DiagnosticsToolUsage { string provider_id = 1; string tool = 2; uint64 calls = 3; uint64 failures = 4; uint64 full_output_bytes = 5; uint64 model_output_bytes = 6; uint64 duration_ms = 7; }
message DiagnosticsSessionUsage { string session_id = 1; string provider_id = 2; string model = 3; uint64 latest_activity_ms = 4; DiagnosticsUsageTotals totals = 5; }
message DiagnosticsReport { uint64 generated_at_ms = 1; uint32 period_days = 2; optional string provider_filter = 3; uint64 sessions_scanned = 4; uint64 sessions_with_activity = 5; DiagnosticsUsageTotals totals = 6; repeated DiagnosticsDailyUsage daily = 7; repeated DiagnosticsToolUsage tools = 8; repeated DiagnosticsSessionUsage sessions = 9; repeated string notes = 10; }

enum InvocationKind {
  INVOCATION_KIND_UNSPECIFIED = 0;
  INVOCATION_KIND_ARCHETYPE = 1;
  INVOCATION_KIND_SKILL = 2;
}
message InvocationUsage {
  InvocationKind kind = 1;
  string identity = 2;
  string display_label = 3;
  bool currently_installed = 4;
  uint64 invocation_count = 5;
  optional uint64 first_used_at_ms = 6;
  optional uint64 last_used_at_ms = 7;
}
message InvocationSummary { bool enabled = 1; repeated InvocationUsage items = 2; }
message InvocationBucket { uint64 start_at_ms = 1; uint64 archetype_count = 2; uint64 skill_count = 3; }
message InvocationTimeline {
  uint64 start_at_ms = 1;
  uint64 end_at_ms = 2;
  uint64 bucket_width_ms = 3;
  repeated InvocationBucket buckets = 4;
}
