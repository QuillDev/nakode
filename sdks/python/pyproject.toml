[project]
name = "nakode-sdk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.81.1,<2",
  "protobuf>=6.33.5,<7",
]

[dependency-groups]
dev = ["grpcio-tools>=1.81.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nakode", "nakode_sdk"]
